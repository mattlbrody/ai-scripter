app = "ai-sales-backend"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SIM_THRESHOLD_DEFAULT = "0.80"
  TURN_SILENCE_MS = "200"
  MIN_TOKENS = "6"
  STACK_MAX = "2"
  EARLY_SHOW_THRESHOLD = "0.88"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[services]]
  http_checks = []
  internal_port = 3000
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 1000
    soft_limit = 800
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[checks]
  [checks.health]
    grace_period = "5s"
    interval = "10s"
    method = "get"
    path = "/api/health"
    port = 3000
    timeout = "2s"
    type = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024